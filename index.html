    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="app.js"></script>

</body> </html> ```

### نصيحة إضافية:
إذا كنت ترغب في وضع السكريبت في الـ `<head>` (أعلى الصفحة) لأسباب تنظيمية، يجب عليك إضافة كلمة `defer` داخل الوسم هكذا:
`<script src="app.js" defer></script>`
كلمة `defer` تخبر المتصفح: "حمّل الملف الآن لكن لا تنفذه إلا بعد انتهاء تحميل الصفحة بالكامل".
